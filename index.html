<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d19" />
    <title>Neural Socket</title>
  </head>
  <body>
    <div id="app">
      <header class="lab-header">
        <div>
          <div class="eyebrow"><span class="pulse-dot"></span> AI HACK DAY / LAB 03</div>
          <h1>Neural Socket</h1>
        </div>
        <div class="alignment">
          <span id="remaining">64</span>
          <small>tokens to align</small>
        </div>
      </header>

      <main>
        <section class="workbench" aria-label="Neural Matrix puzzle">
          <div class="circuit circuit-a"></div>
          <div class="circuit circuit-b"></div>
          <div id="board" class="board" role="grid" aria-label="Neural Matrix board"></div>
        </section>

        <section class="buffer-panel" aria-labelledby="buffer-title">
          <div class="buffer-label">
            <span id="buffer-title">Context buffer</span>
            <span id="capacity-readout">0 / 8</span>
          </div>
          <div id="shelf" class="shelf-drop-zone" aria-label="Context buffer: tap to store selected tokens">
            <div id="shelf-slots" class="shelf-slots"></div>
          </div>
        </section>

        <div id="status" class="status" aria-live="polite">Select a mismatched token.</div>
      </main>

      <footer>
        <button id="undo" type="button" disabled><span aria-hidden="true">↶</span> Undo</button>
        <button id="hint" type="button"><span aria-hidden="true">⌁</span> Hint</button>
        <button id="restart" type="button"><span aria-hidden="true">↻</span> Restart</button>
      </footer>

      <div id="win" class="win-panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
        <div class="win-core" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="eyebrow">ALIGNMENT CERTIFIED</div>
        <h2 id="win-title">Model online</h2>
        <p id="win-copy"></p>
        <button id="win-restart" type="button">Run again</button>
      </div>
      <div id="particles" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
